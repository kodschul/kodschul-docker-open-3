# Fehlerbild 2 (Lab 7.1): Hello-App auf Port 8702
# Start im Ordner fehler2-copy:  docker compose up -d --build
services:
  frontend:
    image: fehler2-frontend:1.0
    build:
      context: frontend
      args:
        - APP_VERSION=1.0.0
    ports:
      - 8702:80
    depends_on:
      - backend

  backend:
    image: backend:v1                       # Image aus Lab 3.2
