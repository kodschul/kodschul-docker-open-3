# Werte aus .env (Platzhalter ${...}) und aus app-config.env (env_file)
# Start: docker compose -f compose-with-config.yml up -d --build
# (ohne --build startet Compose das vorhandene frontend:v1 und FE_VERSION wirkt nicht)
services:
  frontend:
    image: frontend:v1
    build:
      context: ./frontend
      args:
        - APP_VERSION=${FE_VERSION}         # aus .env, nur beim Bauen
    ports:
      - ${FE_PORT}:80                       # aus .env
    env_file:
      - app-config.env                      # Laufzeit-Variablen für den Container

  backend:
    image: backend:v1
    build: backend
    env_file:
      - app-config.env
    deploy:
      replicas: ${BE_REPLICAS}              # aus .env
