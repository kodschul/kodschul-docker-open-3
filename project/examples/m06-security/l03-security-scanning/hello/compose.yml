# Hello-App, Stand ab Lab 6.3: wie Lab 6.2; frontend:v2 wird mit USER app (frontend/Dockerfile) neu gebaut
services:
  frontend:
    image: frontend:v2
    build:
      context: frontend
      args:
        - APP_VERSION=2.0.0
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - 8080:80
    volumes:
      - hello-data:/data                    # Named Volume: access.log überlebt Container
    deploy:
      resources:
        limits:
          cpus: "0.5"                       # höchstens ein halber CPU-Kern
          memory: 128M                      # harte Speichergrenze; darüber: OOMKilled, Exit-Code 137
    develop:
      watch:
        - path: ./frontend/frontend.py
          action: rebuild

  backend:
    image: backend:v1
    build: backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 2s
      retries: 2
      start_period: 3s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

volumes:
  hello-data:                               # von Docker verwaltet; docker compose down -v löscht es
