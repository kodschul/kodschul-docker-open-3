# Logstash-Pipeline (Lab 7.2): Eingänge -> Filter -> Ausgang
input {
  tcp {
    port => 5000                 # Logzeilen per TCP, z. B. echo "Test" | nc localhost 5000
  }
  gelf {
    port => 12201                # Docker-Logtreiber gelf: docker run --log-driver gelf ...
  }
}

filter {
  # Optional: Filter zur Verarbeitung der Logs, z. B. grok zum Zerlegen von Zeilen
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logstash-%{+YYYY.MM.dd}"   # ein Index je Tag; in Kibana als Data View logstash-* auswählbar
  }
}
