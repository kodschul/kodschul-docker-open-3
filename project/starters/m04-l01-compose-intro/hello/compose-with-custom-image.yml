# Eigene Image-Namen, Build-Argumente und Umgebungsvariablen
services:
  frontend:
    image: frontend:v1                      # Name des gebauten Images
    build:
      context: ./frontend
      args:
        - APP_VERSION=1.0.0                 # Build-Zeit: landet über ARG/ENV im Image
    ports:
      - 8080:80
    environment:
      - APP_COLOR=lightblue                 # Laufzeit: überschreibt den Standardwert yellow

  backend:
    image: backend:v1
    build: backend
    deploy:
      replicas: 2
