# Prometheus-Konfiguration (Lab 7.2)
global:
  scrape_interval: 15s                  # alle 15 Sekunden jede Quelle abfragen

scrape_configs:
  - job_name: prometheus                # Prometheus überwacht sich selbst
    static_configs:
      - targets: ['localhost:9090']

