# Hello-App (Lab 4.2, Aufgaben 1 und 2)
# Entwicklungsmodus: Backend mit Healthcheck, Frontend wartet darauf, Watch baut bei Änderungen neu
services:
  frontend:
    image: frontend:v1
    build:
      context: frontend
      args:
        - APP_VERSION=1.0.0
    # TODO 3: depends_on: erst starten, wenn der Dienst backend "healthy" ist (condition: service_healthy)
    ports:
      - 8080:80
    # TODO 4: develop.watch: bei Änderung an ./frontend/frontend.py das Image neu bauen (action: rebuild)

  backend:
    image: backend:v1
    build: backend
